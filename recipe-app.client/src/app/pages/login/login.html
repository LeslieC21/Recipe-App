<div class="container">
    <form>
      <div class="form_inner">
        <h1>Welcome Back!</h1>
        <h2>Login Below!</h2>
        <div class="form-group">
          <input type="text" placeholder="Username" />
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" />
        </div>
        <div class="form-group">
          <button class="form_submit-button" (click)="tryLogin($event)">Create Account</button>
        </div>
      </div>
    </form>
</div>
