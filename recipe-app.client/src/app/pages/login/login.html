<div class="container">
    <form>
      <div class="form_inner">
        <h1>Welcome Back!</h1>
        <h2>Login Below!</h2>
        <div class="form-group">
          <input type="text" placeholder="Username" [formField]="loginForm.username" />
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" [formField]="loginForm.password" />
        </div>
        @if(errorMessage() != null) {
          <p>{{errorMessage()}}</p>
        }
        <div class="form-group">
          <button class="form_submit-button" (click)="tryLogin($event)">Log in</button>
        </div>
      </div>
    </form>
</div>
